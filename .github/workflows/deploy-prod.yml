name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore large files from .gz
        run: |
          gunzip -kf test/test.py.gz
          gunzip -kf public/app.js.gz
          gunzip -kf public/style.css.gz
          echo "restored: $(wc -c < test/test.py) bytes test.py, $(wc -c < public/app.js) bytes app.js, $(wc -c < public/style.css) bytes style.css"

      - name: Deploy to Production
        run: bash /home/xianzhe/actions-runner/_work/Resume-xianzhe.zhao/Resume-xianzhe.zhao/scripts/ci-deploy.sh prod

      - name: Verify deployment
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://resume.zxz0608.com/ai || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 生产环境验证成功：HTTP $HTTP_CODE"
          else
            echo "❌ 生产环境验证失败：HTTP $HTTP_CODE"
            exit 1
          fi
