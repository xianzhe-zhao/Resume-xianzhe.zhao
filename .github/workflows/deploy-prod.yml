name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    env:
      ADMIN_PASSWORD: Resume@Secure2026!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy to Production
        run: bash /home/xianzhe/actions-runner/_work/Resume-xianzhe.zhao/Resume-xianzhe.zhao/scripts/ci-deploy.sh prod

      - name: Verify deployment
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://resume.zxz0608.com/ai || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 生产环境验证成功：HTTP $HTTP_CODE"
          else
            echo "❌ 生产环境验证失败：HTTP $HTTP_CODE"
            exit 1
          fi
