name: Deploy to Test

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test & Deploy to Test Env
    runs-on: self-hosted
    if: github.ref == 'refs/heads/test'
    env:
      ADMIN_PASSWORD: Resume@Secure2026!

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run tests
        env:
          ADMIN_PASSWORD: test_password_for_ci
        run: python3 test/test.py

      - name: Deploy to Test
        run: |
          set -e

          PM2=/home/xianzhe/.npm/_npx/5f7878ce38f1eb13/node_modules/pm2/bin/pm2
          export PM2_HOME=/home/xianzhe/.pm2
          TARGET_DIR=/home/xianzhe/Project/resume-test
          TARGET_PORT=3002
          PM2_NAME=resume-test

          # 备份当前版本（保留最近 5 个）
          if [ -d "$TARGET_DIR" ] && [ "$(ls -A $TARGET_DIR 2>/dev/null)" ]; then
              BACKUP_DIR="${TARGET_DIR}-backup-$(date +%Y%m%d%H%M%S)"
              echo "备份当前版本到：$BACKUP_DIR"
              cp -r "$TARGET_DIR" "$BACKUP_DIR"
              
              # 清理旧备份，保留最近 5 个
              ls -dt ${TARGET_DIR}-backup-* 2>/dev/null | tail -n +6 | xargs rm -rf 2>/dev/null || true
          fi

          # 部署：同步文件（排除不需要的）
          echo "部署新版本到测试环境..."
          rsync -av --delete ./ "$TARGET_DIR/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='docs' \
            --exclude='test' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            --exclude='scripts'

          # 重启服务
          cd "$TARGET_DIR"
          export PORT=$TARGET_PORT
          export ADMIN_PASSWORD="${ADMIN_PASSWORD:-Resume@Secure2026!}"

          # 部署：同步文件（排除不需要的）
          echo "部署新版本到测试环境..."
          rsync -av --delete ./ "$TARGET_DIR/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='docs' \
            --exclude='test' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            --exclude='scripts'

          # 写入 .env 文件（必须在 rsync 之后，否则会被 --delete 删掉）
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" > "$TARGET_DIR/.env"
          echo "PORT=$TARGET_PORT" >> "$TARGET_DIR/.env"
          echo ".env 文件已写入"

          # 强制杀掉占用端口的旧进程
          echo "停止旧进程..."
          $PM2 delete $PM2_NAME 2>/dev/null || true
          OLD_PID=$(lsof -ti :$TARGET_PORT 2>/dev/null)
          if [ -n "$OLD_PID" ]; then
              echo "杀掉占用端口 $TARGET_PORT 的进程 (PID: $OLD_PID)"
              kill -9 $OLD_PID 2>/dev/null || true
          fi
          sleep 2

          # 启动新进程
          echo "启动 PM2 进程：$PM2_NAME (端口 $TARGET_PORT)"
          cd "$TARGET_DIR"
          $PM2 start server.js --name $PM2_NAME

          $PM2 save
          echo "✅ 测试环境部署完成！"

      - name: Verify deployment
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/ai || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 测试环境验证成功：HTTP $HTTP_CODE"
          else
            echo "❌ 测试环境验证失败：HTTP $HTTP_CODE"
            echo "检查 PM2 日志："
            cat /home/xianzhe/.pm2/logs/resume-test-error.log 2>/dev/null | tail -5
            echo "检查 .env 文件："
            cat /home/xianzhe/Project/resume-test/.env 2>/dev/null
            exit 1
          fi
