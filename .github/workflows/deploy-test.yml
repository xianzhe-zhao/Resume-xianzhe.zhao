name: Deploy to Test

on:
  push:
    branches: [test]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test & Deploy to Test Env
    runs-on: self-hosted
    if: github.ref == 'refs/heads/test'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore large files from .gz
        run: |
          gunzip -kf test/test.py.gz
          gunzip -kf public/app.js.gz
          gunzip -kf public/style.css.gz
          echo "restored: $(wc -c < test/test.py) bytes test.py, $(wc -c < public/app.js) bytes app.js, $(wc -c < public/style.css) bytes style.css"

      - name: Run tests
        env:
          ADMIN_PASSWORD: test_password_for_ci
        run: python3 test/test.py

      - name: Deploy to Test
        run: bash /home/xianzhe/actions-runner/_work/Resume-xianzhe.zhao/Resume-xianzhe.zhao/scripts/ci-deploy.sh test

      - name: Verify deployment
        run: |
          sleep 3
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3002/ai || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 测试环境验证成功：HTTP $HTTP_CODE"
          else
            echo "❌ 测试环境验证失败：HTTP $HTTP_CODE"
            cat /home/xianzhe/.pm2/logs/resume-test-error.log 2>/dev/null | tail -5
            exit 1
          fi
