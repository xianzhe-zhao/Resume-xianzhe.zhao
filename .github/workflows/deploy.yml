name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run tests
        env:
          ADMIN_PASSWORD: test_password_for_ci
        run: python test/test.py

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: github-actions-runner

      - name: Deploy via SSH
        env:
          SERVER_USER: xianzhe
          SERVER_HOST: 100.76.122.13
          SERVER_PASS: ${{ secrets.SERVER_PASS }}
        run: |
          # 添加服务器到 known_hosts
          mkdir -p ~/.ssh
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # 创建临时打包目录
          TEMP_DIR=$(mktemp -d)
          
          # 复制必要文件
          rsync -av ./ "$TEMP_DIR/" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='docs' \
            --exclude='test' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            --exclude='scripts'
          
          # 创建 tar 包
          TAR_FILE="/tmp/resume-deploy.tar.gz"
          tar -czf "$TAR_FILE" -C "$TEMP_DIR" .
          rm -rf "$TEMP_DIR"
          
          # 上传到服务器（使用 sshpass 或密钥）
          if [ -n "$SERVER_PASS" ]; then
            sshpass -p "$SERVER_PASS" scp "$TAR_FILE" ${SERVER_USER}@${SERVER_HOST}:/tmp/
          else
            scp "$TAR_FILE" ${SERVER_USER}@${SERVER_HOST}:/tmp/
          fi
          
          # 在服务器上执行部署
          if [ -n "$SERVER_PASS" ]; then
            sshpass -p "$SERVER_PASS" ssh ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
              set -e
              
              PM2=/home/xianzhe/.npm/_npx/5f7878ce38f1eb13/node_modules/pm2/bin/pm2
              export PM2_HOME=/home/xianzhe/.pm2
              TARGET_DIR=/home/xianzhe/Project/resume
              TARGET_PORT=3000
              PM2_NAME=resume
              TAR_FILE=/tmp/resume-deploy.tar.gz
              
              # 备份当前版本
              if [ -d "$TARGET_DIR" ] && [ "$(ls -A $TARGET_DIR 2>/dev/null)" ]; then
                  BACKUP_DIR="${TARGET_DIR}-backup-$(date +%Y%m%d%H%M%S)"
                  echo "备份当前版本到: $BACKUP_DIR"
                  cp -r "$TARGET_DIR" "$BACKUP_DIR"
              fi
              
              # 解压新版本
              echo "解压新版本..."
              TEMP_EXTRACT=/tmp/resume-extract-$$
              mkdir -p "$TEMP_EXTRACT"
              tar -xzf "$TAR_FILE" -C "$TEMP_EXTRACT"
              
              # 替换目录内容
              rm -rf "$TARGET_DIR"/*
              cp -r "$TEMP_EXTRACT"/* "$TARGET_DIR"/
              rm -rf "$TEMP_EXTRACT"
              rm "$TAR_FILE"
              
              # 重启服务
              cd "$TARGET_DIR"
              export PORT=$TARGET_PORT
              export ADMIN_PASSWORD="${ADMIN_PASSWORD:-Resume@Secure2026!}"
              
              if $PM2 describe $PM2_NAME > /dev/null 2>&1; then
                  echo "重启 PM2 进程: $PM2_NAME"
                  $PM2 restart $PM2_NAME --update-env
              else
                  echo "启动新的 PM2 进程: $PM2_NAME"
                  $PM2 start server.js --name $PM2_NAME --update-env
              fi
              
              $PM2 save
              echo "✅ 部署完成!"
            ENDSSH
          else
            ssh ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
              set -e
              
              PM2=/home/xianzhe/.npm/_npx/5f7878ce38f1eb13/node_modules/pm2/bin/pm2
              export PM2_HOME=/home/xianzhe/.pm2
              TARGET_DIR=/home/xianzhe/Project/resume
              TARGET_PORT=3000
              PM2_NAME=resume
              TAR_FILE=/tmp/resume-deploy.tar.gz
              
              if [ -d "$TARGET_DIR" ] && [ "$(ls -A $TARGET_DIR 2>/dev/null)" ]; then
                  BACKUP_DIR="${TARGET_DIR}-backup-$(date +%Y%m%d%H%M%S)"
                  echo "备份当前版本到: $BACKUP_DIR"
                  cp -r "$TARGET_DIR" "$BACKUP_DIR"
              fi
              
              echo "解压新版本..."
              TEMP_EXTRACT=/tmp/resume-extract-$$
              mkdir -p "$TEMP_EXTRACT"
              tar -xzf "$TAR_FILE" -C "$TEMP_EXTRACT"
              
              rm -rf "$TARGET_DIR"/*
              cp -r "$TEMP_EXTRACT"/* "$TARGET_DIR"/
              rm -rf "$TEMP_EXTRACT"
              rm "$TAR_FILE"
              
              cd "$TARGET_DIR"
              export PORT=$TARGET_PORT
              export ADMIN_PASSWORD="${ADMIN_PASSWORD:-Resume@Secure2026!}"
              
              if $PM2 describe $PM2_NAME > /dev/null 2>&1; then
                  echo "重启 PM2 进程: $PM2_NAME"
                  $PM2 restart $PM2_NAME --update-env
              else
                  echo "启动新的 PM2 进程: $PM2_NAME"
                  $PM2 start server.js --name $PM2_NAME --update-env
              fi
              
              $PM2 save
              echo "✅ 部署完成!"
            ENDSSH
          fi
          
          # 清理本地临时文件
          rm -f "$TAR_FILE"

      - name: Verify deployment
        run: |
          echo "等待服务启动..."
          sleep 5
          
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://resume.zxz0608.com/ai || echo "000")
          
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ 部署验证成功：HTTP $HTTP_CODE"
          else
            echo "❌ 部署验证失败：HTTP $HTTP_CODE"
            exit 1
          fi
